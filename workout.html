<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Plan – Mall Cops</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="workout.css">
</head>
<body>



<div class="topbar"></div>

<header>
  <a class="back-link" href="members.html">&#8592; MEMBERS</a>
  <div class="logo">
    <span class="logo-icon">🏃</span>
    <span class="logo-main" id="headerName"></span>
    <span class="logo-accent">TRAINING</span>
  </div>
  <div id="saveStatus"></div>
</header>

<!-- Coach bar – only visible for coaches -->
<div class="coach-bar" id="coachBar">
  <span class="coach-bar-lbl">VIEWING:</span>
  <select class="athlete-select" id="athleteSelect">
    <option value="__self__">MY PLAN</option>
  </select>
  <span class="coach-bar-tag" id="coachBarTag">COACH VIEW</span>
</div>

<!-- View tab bar -->
<div class="view-tabs">
  <button class="view-tab active" id="tabWorkout">WORKOUT</button>
  <button class="view-tab" id="tabStats">STATISTICS</button>
</div>

<div class="app" id="appWorkout">



  <!-- Month Calendar (desktop/tablet) -->
  <div class="calendar-card">
    <div class="cal-header">
      <div class="month-nav">
        <button class="nav-btn" id="prevBtn">&#8592;</button>
        <span class="month-title" id="monthTitle"></span>
        <button class="nav-btn" id="nextBtn">&#8594;</button>
      </div>
      <button class="nav-btn today-btn" id="todayBtn">Today</button>
      <button class="nav-btn pdf-btn" id="pdfBtn" onclick="exportPDF()" title="Export month as PDF">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 10.5h9M6.5 1v7M6.5 8l-2.5-2.5M6.5 8l2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        PDF
      </button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- Week View (mobile) -->
  <div class="week-view" id="weekView">
    <div class="week-nav">
      <button class="nav-btn wk-nav-btn" id="prevWeekBtn">&#8592;</button>
      <span class="week-title" id="weekTitle"></span>
      <button class="nav-btn wk-nav-btn" id="nextWeekBtn">&#8594;</button>
      <button class="nav-btn week-today-btn" id="weekTodayBtn">TODAY</button>
      <button class="nav-btn wk-pdf-btn" id="wkPdfBtn" onclick="exportPDF()" title="Export as PDF">
        <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M2 10.5h9M6.5 1v7M6.5 8l-2.5-2.5M6.5 8l2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        PDF
      </button>
    </div>
    <div id="weekDays"></div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">

    <div class="card">
      <div class="card-title">This Month</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val" id="statDist">0</div><div class="stat-lbl">mi total</div></div>
        <div class="stat-box"><div class="stat-val" id="statRuns">0</div><div class="stat-lbl">workouts</div></div>
        <div class="stat-box"><div class="stat-val" id="statDone">0</div><div class="stat-lbl">completed</div></div>
      </div>
      <div class="week-chart">
        <div class="week-chart-label">Weekly Distance (mi)</div>
        <div class="week-bars" id="weekBars"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Race Day</div>
      <input type="date" class="form-input" id="raceDateInput">
      <div class="race-countdown-text" id="raceCountdownText"></div>
    </div>

    <div class="card">
      <div class="card-title">Upcoming</div>
      <div class="upcoming-list" id="upcomingList"></div>
    </div>

    <div class="card" id="templatesCard">
      <div class="card-title">Templates</div>
      <div id="templatesList"></div>
      <button class="new-template-btn" id="newTemplateBtn" type="button">+ NEW TEMPLATE</button>
    </div>

  </div>
</div>

<!-- Statistics Panel -->
<div class="stats-panel" id="appStats">
  <div class="stats-card">
    <div class="stats-controls">
      <div class="stats-nav">
        <button class="nav-btn stats-arrow" id="statsPrevBtn">&#8592;</button>
        <span class="stats-period-label" id="statsPeriodLabel"></span>
        <button class="nav-btn stats-arrow" id="statsNextBtn">&#8594;</button>
        <button class="nav-btn stats-now-btn" id="statsNowBtn">NOW</button>
      </div>
    </div>
    <div class="stats-week-filter" id="statsWeekFilter"></div>
    <div class="stats-kpi-row"  id="statsKpis"></div>
    <div id="statsIntensity"></div>
    <div class="stats-breakdown" id="statsBreakdown"></div>
    <div class="stats-log-section" id="statsLog"></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" title="Add today's workout">+</button>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="modalTitle">Add Workout</div>
        <div class="modal-date-str" id="modalDateStr"></div>
      </div>
      <button class="close-btn" id="closeBtn">&#10005;</button>
    </div>
    <!-- Template name (only shown in template mode) -->
    <div class="field" id="templateNameField" style="display:none">
      <label class="field-label" for="templateNameInput">Template Name</label>
      <input type="text" class="form-input" id="templateNameInput" placeholder="e.g. Track Tuesday, MP Long Run…">
    </div>
    <!-- Template visibility toggle (only shown in template mode) -->
    <div class="field" id="templateVisibilityField" style="display:none">
      <div class="completed-toggle" id="templatePublicToggle">
        <div class="toggle-track" id="tplToggleTrack"><div class="toggle-thumb"></div></div>
        <span class="toggle-label" id="tplToggleLabel">Private – only visible to you</span>
      </div>
    </div>

    <div class="field">
      <div class="field-label">Workout Type</div>
      <div class="type-pills" id="typePills"></div>
    </div>
    <!-- Long Run subtype – shown only when type = long -->
    <div class="field" id="lrSubtypeField" style="display:none">
      <div class="field-label">Long Run Type</div>
      <div class="lr-subtype-row" id="lrSubtypeRow"></div>
    </div>

    <!-- Load template row (shown in builder mode when templates exist) -->
    <div class="load-tpl-wrap" id="loadTemplateRow" style="display:none">
      <span class="load-tpl-lbl">TEMPLATE:</span>
      <select class="load-tpl-sel" id="templateSelect">
        <option value="">↓ load a template…</option>
      </select>
    </div>

    <!-- Simple fields: dist · pace · duration (hidden for structured workouts) -->
    <div id="simpleFields">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
        <div>
          <label class="field-label" for="distInput">Distance (mi)</label>
          <input type="number" class="form-input" id="distInput" step="0.1" min="0" placeholder="e.g. 6.2">
        </div>
        <div>
          <label class="field-label" for="paceInput">Pace /mi</label>
          <input type="text" class="form-input" id="paceInput" placeholder="e.g. 8:30">
        </div>
        <div>
          <label class="field-label" for="durInput">Duration</label>
          <input type="text" class="form-input" id="durInput" placeholder="e.g. 1:05">
        </div>
      </div>
    </div>

    <!-- Builder section – shown for tempo / intervals / workout long run -->
    <div id="builderSection" style="display:none;margin-bottom:8px"></div>

    <!-- Live workout summary -->
    <div class="builder-summary" id="builderSummary" style="display:none"></div>

    <div class="field" id="effortField">
      <div class="field-label">Perceived Effort</div>
      <div class="effort-row" id="effortRow"></div>
    </div>
    <div class="field" id="notesField">
      <label class="field-label" for="notesInput">Notes</label>
      <textarea class="form-textarea" id="notesInput" placeholder="How did it go? Anything to note…"></textarea>
    </div>
    <div class="field" id="completedField">
      <div class="completed-toggle" id="completedToggle">
        <div class="toggle-track" id="toggleTrack"><div class="toggle-thumb"></div></div>
        <span class="toggle-label">Mark as completed</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-delete" id="deleteBtn" style="display:none">Delete</button>
      <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn btn-save" id="saveBtn">Save Workout</button>
    </div>
  </div>
</div>

<script src="workout.js"></script>
</body>
</html>
